[package]
name = "peek2"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "Peek rewritten in Rust: region screen recorder with audio"
repository = "https://github.com/rotkonetworks/peek2"
readme = "README.md"

# Deliberately small: X11 is spoken directly (x11rb, pure Rust), everything
# else is std plus tools already on the box (ffmpeg, pactl, notify-send).
[dependencies]
anyhow = "1.0.104"
x11rb = { version = "0.13", features = ["randr", "shape"] }

[profile.release]
lto = "thin"
