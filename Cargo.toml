[package]
name = "peek2"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Peek rewritten in Rust: region screen recorder with audio"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
gdk4-x11 = "0.11"
gifski = { version = "1.34", default-features = false, features = ["gifsicle"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
imgref = "1.12.3"
rgb = "0.8.53"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
x11rb = "0.13"

# gifski and image code are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
